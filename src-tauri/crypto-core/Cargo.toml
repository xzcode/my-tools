[package]
name = "my-tools-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[dependencies]
openssl = { version = "0.10.82", features = ["vendored"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
encoding_rs = "0.8"
openssl-sys = "0.9"
foreign-types = "0.3"

tempfile = "3"
argon2 = "0.5.3"
blake3 = "1.8"
crc32fast = "1.5"
chacha20poly1305 = "0.10.1"
sm4 = "0.5"
aes-gcm = "0.10"
des = "0.8"
cbc = "0.1"
der = { version = "0.7", features = ["derive", "alloc"] }
ssh-key = { version = "0.6.7", features = ["encryption", "getrandom"] }
jks = { version = "0.3.3", default-features = false, features = ["rand"] }
